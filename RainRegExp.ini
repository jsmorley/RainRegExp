; Reread whenever Connect is clicked. Keep this file beside RainRegExp.exe.
[WebParser]
ProxyServer=/auto
UserAgent=Rainmeter WebParser plugin
; Headers must be consecutive: Header, Header2, Header3, ...
; Header=Accept: text/html
; Header2=Accept-Language: en-US
Flags=Resync
; Combine flags with |, for example Resync|NoCookies|NoCacheWrite
; Supported: ForceReload, Resync, NoCookies, Hyperlink, TempFile, NoAuth,
; NoCacheWrite, PragmaNoCache, Secure, IgnoreCertName, IgnoreCertDate,
; IgnoreHTTPRedirect, IgnoreHTTPSRedirect
; ProxyServer: /auto = Windows settings, /none = direct, or host:port
